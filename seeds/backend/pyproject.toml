[project]
name = "code-transformation-engine-backend"
version = "0.1.0"
description = "Code Transformation Engine backend (FastAPI + Strands agents)."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.31",
    # boto3/botocore bumped to >=1.35.74 to satisfy langchain-aws==0.2.10.
    "boto3>=1.35.74,<1.36.0",
    "botocore>=1.35.74,<1.36.0",
    "langchain-aws==0.2.10",
    # LangChain core orchestration (0.3+ per tech steering); langchain-aws==0.2.10
    # already constrains langchain-core, so the resolver aligns the two.
    "langchain>=0.3,<0.4",
    # CrewAI multi-step agent chains (0.80+ per tech steering).
    "crewai>=0.80",
    "strands-agents>=1.0.0,<2.0.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    # bcrypt pinned <4.1: passlib 1.7.4's backend self-test hashes a >72-byte
    # value, which bcrypt >=4.1 rejects with ValueError (breaks password hashing).
    "bcrypt==4.0.1",
    "slowapi==0.1.9",
    "tree-sitter==0.23.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python==0.23.6",
    "tree-sitter-javascript==0.23.1",
    # tree-sitter-c-sharp pinned to 0.21.3, NOT 0.23.x. 0.23.1 resolves and
    # installs cleanly against tree-sitter==0.23.2, then fails at first use:
    # assigning the Language to a Parser raises
    #   ValueError: Incompatible Language version 15. Must be between 13 and 14
    # 0.21.3 reports a supported ABI and parses C# correctly. Verified by
    # resolving + importing + parsing both pins against tree-sitter==0.23.2.
    "tree-sitter-c-sharp==0.21.3",
    "tree-sitter-c==0.23.4",
    "GitPython==3.1.58",
    "defusedxml==0.7.1",
    "requests==2.32.3",
    "httpx==0.28.1",
    # Declared explicitly, not left to resolve transitively via crewai->litellm
    # or via mcp: routes/ai_streaming.py imports sse_starlette directly, and the
    # agent streaming tests depend on specific sse_starlette.sse.AppStatus reset
    # behaviour. An undeclared direct import is an unpinned transitive version.
    "sse-starlette==2.1.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "hypothesis==6.122.3",
    # `make lint` / `make format` run `uv run ruff`; ruff is never installed
    # globally (dev-env.md), so it MUST be a dev dependency here or Task 1's own
    # verification line (`make lint && make test`) cannot pass.
    "ruff==0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

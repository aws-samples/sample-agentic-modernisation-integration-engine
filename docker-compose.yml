# ============================================================================
# Code Transformation Engine - Local Development Stack
#
# Software 3.0 microservices: React frontend + FastAPI backend orchestrator +
# specialized autonomous AI agents (ATX analysis/transform).
#
# NOTE: This compose file declares only the four modules the current codebase
# supports — frontend, backend, atx-analysis-agent, atx-transform-agent — so an
# unscoped `docker compose up -d --build` works without naming services. The
# optional agents (design-doc, kiro-cli, ant-to-maven, eks-*) are not part of
# this build and are intentionally omitted.
#
# Conventions (per design.md Service Registry & Docker Volume Mapping):
#   - All services bind to 127.0.0.1 only (no external network exposure).
#   - security_opt: no-new-privileges:true on every service.
#   - platform: linux/arm64 (required by ECS Fargate + AgentCore Runtime).
#   - deploy.resources.limits pinned per the Service Registry table.
#   - Health checks on every service; restart: unless-stopped.
#   - frontend bridges frontend-net + backend-net; all other services are
#     backend-net only.
#
# Usage:
#   cp .env.example .env
#   docker-compose up -d --build                 # full stack (all 4 modules)
#   docker-compose up -d --build backend         # single service
#   docker-compose logs -f backend               # tail logs
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Frontend — React 18 SPA served by Nginx, reverse-proxies to all agents.
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: code-transformation-engine/frontend:latest
    platform: linux/arm64
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - BACKEND_URL=http://backend:8000
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Backend API — FastAPI orchestrator (Tree-sitter parsing, Strands agents).
  # --------------------------------------------------------------------------
  #
  # Credentials (Requirement 19): this file is the LOCAL-DEV path
  # (AGENTCORE_MODE=false) — AWS keys and GITHUB_TOKEN come from the git-ignored
  # .env via env_file and are never hardcoded here. In AgentCore mode credentials
  # are NOT injected: AWS access is via the per-agent execution role and the
  # GitHub PAT is fetched at invocation time from AgentCore Identity
  # (GetWorkloadAccessToken). Leave GITHUB_TOKEN/AWS_* blank for AgentCore mode.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: code-transformation-engine/backend:latest
    platform: linux/arm64
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # AWS_REGION and BEDROCK_MODEL_ID come from .env (env_file) so it is the
      # single source of truth and overrides any shell-exported AWS_REGION.
      - AUTH_DISABLED=${AUTH_DISABLED:-true}
      - AGENTCORE_MODE=${AGENTCORE_MODE:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - KIRO_CLI_AGENT_URL=http://kiro-cli-agent:8007
    volumes:
      - backend-data:/app/temp
      - shared-repos:/app/shared_repos
      - transformation-definitions:/app/shared/transformation_def
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # ATX Analysis Agent — ATX CLI code assessment with SSE streaming.
  # --------------------------------------------------------------------------
  atx-analysis-agent:
    build:
      context: ./atx-analysis-agent
      dockerfile: Dockerfile
    image: code-transformation-engine/atx-analysis-agent:latest
    platform: linux/arm64
    ports:
      - "127.0.0.1:8004:8004"
    env_file:
      - path: .env
        required: false
    environment:
      # AWS_REGION and BEDROCK_MODEL_ID come from .env (env_file) so it is the
      # single source of truth and overrides any shell-exported AWS_REGION.
      - AGENTCORE_MODE=${AGENTCORE_MODE:-false}
    volumes:
      - atx-analysis-storage:/app/storage
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # ATX Transform Agent — Java modernization (diff + PR), reads transform defs.
  #
  # GitHub PR creation (Requirement 19): no GITHUB_TOKEN is injected here in
  # AgentCore mode — the PAT is fetched at invocation time from AgentCore
  # Identity (GetWorkloadAccessToken). For local dev it falls back to the
  # GITHUB_TOKEN supplied via .env (env_file below).
  # --------------------------------------------------------------------------
  atx-transform-agent:
    build:
      context: ./atx-transform-agent
      dockerfile: Dockerfile
    image: code-transformation-engine/atx-transform-agent:latest
    platform: linux/arm64
    ports:
      - "127.0.0.1:8005:8005"
    env_file:
      - path: .env
        required: false
    environment:
      # AWS_REGION and BEDROCK_MODEL_ID come from .env (env_file) so it is the
      # single source of truth and overrides any shell-exported AWS_REGION.
      - AGENTCORE_MODE=${AGENTCORE_MODE:-false}
    volumes:
      - atx-java-transform-storage:/app/storage
      - transformation-definitions:/app/shared/transformation_def:ro
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

# ----------------------------------------------------------------------------
# Named volumes (per design.md Docker Volume Mapping table).
# ----------------------------------------------------------------------------
volumes:
  backend-data:                 # backend:/app/temp — analysis JSON storage
  shared-repos:                 # backend:/app/shared_repos
  atx-analysis-storage:         # atx-analysis:/app/storage — conversation data
  atx-java-transform-storage:   # atx-transform:/app/storage — transform results
  transformation-definitions:   # backend (rw) + atx-transform (ro) — ATX defs

# ----------------------------------------------------------------------------
# Networks — frontend isolated on frontend-net; all HTTP on backend-net.
# ----------------------------------------------------------------------------
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

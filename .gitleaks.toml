# gitleaks configuration
#
# Extends the default gitleaks ruleset and adds allowlists for known false
# positives. See https://github.com/gitleaks/gitleaks for the schema.

[extend]
useDefault = true

[allowlist]
description = "Global allowlisted paths and false positives"

# uv.lock is a generated dependency lockfile. Its package integrity hashes
# (sha256 = "...") and pythonhosted.org URL path segments are base64-like and
# match the square-access-token / generic patterns, but contain no credentials.
# The file is produced by `uv lock` and must not be hand-edited.
paths = [
    '''backend/uv\.lock''',
    '''.*/uv\.lock''',
]

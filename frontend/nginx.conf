# =============================================================================
# Code Transformation Engine - Frontend Nginx configuration
#
# Serves the compiled React 18 SPA (static files in /usr/share/nginx/html) and
# reverse-proxies API traffic to every backend FastAPI agent plus the ttyd
# container agents. This is the single entry point (port 3000) referenced by
# docker-compose (frontend-net + backend-net bridge).
#
# --- CRITICAL nginx behaviour used throughout this file ----------------------
# Upstream hosts are resolved at REQUEST TIME via the Docker embedded DNS
# resolver (127.0.0.11) using `set $var http://service:port;` + `proxy_pass
# $var;`. This has two important consequences:
#
#   1. nginx does NOT fail to start when an upstream container is down/absent
#      (names are resolved lazily, per-request, not at config-load time).
#
#   2. When proxy_pass uses a VARIABLE, nginx does NOT rewrite/strip the
#      matched location prefix from the URI. The full, normalized request URI
#      is forwarded to the upstream AS-IS. Therefore proxy_pass MUST NOT carry
#      a trailing path/URI component:
#
#          set $backend http://backend:8000;
#          proxy_pass  $backend;          # -> forwards /api/... unchanged  (correct)
#          proxy_pass  $backend/api/;     # -> DOUBLE prefix /api//api/...   (WRONG)
#
#      Every backend service in this platform serves under its own prefix
#      (/api/, /atx/, /atx-transform/, /design-doc/, /ant-to-maven/), so
#      passing the URI through untouched is exactly what we want.
# =============================================================================

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log to stdout/stderr so `docker logs` / CloudWatch capture everything.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct="$upstream_response_time"';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Allow large uploads (repository ZIP archives, build files, etc.).
    client_max_body_size 100M;

    # Temp/cache paths under /tmp so the server can run as a non-root user.
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # gzip static assets served by the SPA.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # WebSocket upgrade mapping (used by the /containers/ ttyd terminals).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen      3000;
        server_name _;

        # Docker embedded DNS. `valid=` keeps resolution fresh as containers
        # restart and get new IPs; ipv6=off avoids AAAA lookups on the bridge.
        resolver         127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;

        root  /usr/share/nginx/html;
        index index.html;

        # Common proxy headers reused by every backend location.
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # ---------------------------------------------------------------------
        # Backend orchestrator API (FastAPI :8000). SSE streaming is used for
        # all AI operations, so response buffering is disabled here.
        # ---------------------------------------------------------------------
        location /api/ {
            set $backend_api http://backend:8000;
            proxy_pass $backend_api;

            proxy_set_header Connection "";
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            chunked_transfer_encoding on;
        }

        # Backend health probe (also proxied to the backend service).
        location /health {
            set $backend_health http://backend:8000;
            proxy_pass $backend_health;
            proxy_read_timeout 10s;
        }

        # ---------------------------------------------------------------------
        # ATX Analysis Agent (:8004) - ATX CLI code assessment, SSE streaming.
        # ---------------------------------------------------------------------
        location /atx/ {
            set $atx_analysis http://atx-analysis-agent:8004;
            rewrite ^/atx/(.*) /$1 break;
            proxy_pass $atx_analysis;

            proxy_set_header Connection "";
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            chunked_transfer_encoding on;
        }

        # ---------------------------------------------------------------------
        # ATX Transform Agent (:8005) - Java modernization (diff + PR).
        # ---------------------------------------------------------------------
        location /atx-transform/ {
            set $atx_transform http://atx-transform-agent:8005;
            rewrite ^/atx-transform/(.*) /$1 break;
            proxy_pass $atx_transform;

            proxy_set_header Connection "";
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            chunked_transfer_encoding on;
        }

        # ---------------------------------------------------------------------
        # Design Doc Agent (:8006) - 5-stage To-Be architecture pipeline.
        # Long-running SSE stages -> buffering off, generous timeouts.
        # ---------------------------------------------------------------------
        location /design-doc/ {
            set $design_doc http://design-doc-agent:8006;
            proxy_pass $design_doc;

            proxy_set_header Connection "";
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            chunked_transfer_encoding on;
        }

        # ---------------------------------------------------------------------
        # Ant-to-Maven Agent (:8008) - build.xml -> pom.xml migration.
        # ---------------------------------------------------------------------
        location /ant-to-maven/ {
            set $ant_to_maven http://ant-to-maven-agent:8008;
            proxy_pass $ant_to_maven;

            proxy_set_header Connection "";
            proxy_buffering     off;
            proxy_cache         off;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            chunked_transfer_encoding on;
        }

        # ---------------------------------------------------------------------
        # Container agents (ttyd web terminals) - WebSocket upgrade required.
        # Each EKS delivery/design agent is reached under its own sub-path so a
        # single /containers/ prefix fans out to all four ttyd services.
        # Because proxy_pass uses a variable, the full /containers/<agent>/...
        # URI is forwarded unchanged (ttyd serves from that mount path).
        # ---------------------------------------------------------------------
        location /containers/eks-delivery-kiro/ {
            set $ttyd_del_kiro http://eks-delivery-kiro:7681;
            proxy_pass $ttyd_del_kiro;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /containers/eks-delivery-claude/ {
            set $ttyd_del_claude http://eks-delivery-claude:7682;
            proxy_pass $ttyd_del_claude;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /containers/eks-design-kiro/ {
            set $ttyd_des_kiro http://eks-design-kiro:7683;
            proxy_pass $ttyd_des_kiro;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /containers/eks-design-claude/ {
            set $ttyd_des_claude http://eks-design-claude:7684;
            proxy_pass $ttyd_des_claude;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---------------------------------------------------------------------
        # Static SPA - serve compiled assets, fall back to index.html so the
        # client-side router (react-router-dom) can handle deep links.
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Long-cache hashed build assets emitted by Vite.
        location /assets/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }
    }
}

[project]
name = "code-transformation-engine-backend"
version = "0.1.0"
description = "Code Transformation Engine backend (FastAPI + Strands agents)."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.31",
    # boto3/botocore floor kept at >=1.35.74 for recent Bedrock runtime APIs.
    "boto3>=1.35.74,<1.36.0",
    "botocore>=1.35.74,<1.36.0",
    "strands-agents>=1.30.0,<2.0.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    # bcrypt pinned <4.1: passlib 1.7.4's backend self-test hashes a >72-byte
    # value, which bcrypt >=4.1 rejects with ValueError (breaks password hashing).
    "bcrypt==4.0.1",
    "slowapi==0.1.9",
    "tree-sitter==0.23.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python==0.23.6",
    "tree-sitter-javascript==0.23.1",
    "tree-sitter-c-sharp==0.21.3",
    "tree-sitter-c==0.23.4",
    "GitPython==3.1.59",
    "defusedxml==0.7.1",
    "requests==2.33.0",
    "httpx==0.28.1",
    "sse-starlette==2.1.3",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "hypothesis==6.122.3",
    "ruff==0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

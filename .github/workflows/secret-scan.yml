name: Secret Scan

# Credential gate, kept in its own workflow so the weekly full-history sweep does
# not drag the rest of CI onto a schedule. Two triggers, two scopes:
#
#   - pull_request: scan only the PR's commit range (fast; a pre-existing secret
#     on an unrelated branch must not block every PR).
#   - schedule: weekly full-history sweep, to surface a secret committed before
#     the per-PR gate existed.
#
# This repo has a specific reason to care: GitHub PATs are a first-class input
# (github_handler.py clones with a PAT, encryption.py stores it) and AWS
# credentials are passed to every service for Bedrock. Both shapes are covered by
# .gitleaks.toml.
on:
  pull_request:
    branches: [main]
  schedule:
    # Mondays 07:00 UTC.
    - cron: "0 7 * * 1"
  # A disclosure does not wait for Monday.
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # Pinned release asset + its published SHA-256, verified before execution so a
  # tampered or mutated asset cannot run in CI. Update both together on a version
  # bump, and keep the version in sync with .pre-commit-config.yaml.
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # History is needed for both scopes: on a PR this is the PR's commits,
          # on the scheduled run it is the whole default branch.
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}" -o "$asset"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          sudo tar -xzf "$asset" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan PR commit range
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Fail closed: gitleaks exits 0 (secret undetected) if the log range
          # cannot be resolved — e.g. the base SHA is not in the checkout. Verify
          # both endpoints exist first so a broken range cannot silently pass.
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            git cat-file -e "${sha}^{commit}" 2>/dev/null || {
              echo "::error::commit $sha not present in checkout; cannot scan the PR range safely"
              exit 1
            }
          done
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1 \
            --log-opts "${BASE_SHA}..${HEAD_SHA}"

      # A hit here means: rotate/revoke the credential FIRST. Rewriting history is
      # a secondary, high-cost step that never substitutes for rotation. See
      # SECURITY.md.
      - name: Full-history scan (scheduled / manual)
        if: github.event_name != 'pull_request'
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
